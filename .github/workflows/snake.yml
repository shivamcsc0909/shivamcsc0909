name: GitHub Snake Game 🐍

on:
  # Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger
  workflow_dispatch:
  # Also trigger on push to main
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ✅ Step 1: Checkout your repo
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      # ✅ Step 2: Generate snake contributions animation
      - name: 🐍 Generate Snake SVG + GIF
        uses: Platane/snk@v3
        with:
          github_user_name: shivamcsc0909
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Step 3: Deploy files to 'output' branch
      - name: 🚀 Deploy to GitHub Pages (output branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "🐍 Update GitHub Snake Animation [skip ci]"
